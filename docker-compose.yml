services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [maf]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "${DB_NAME:-maf_database}"
      FRONTEND_URL: "${SERVER_URL:-http://localhost}"
    depends_on:
      - mongo
    networks: [maf]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks: [maf]

volumes:
  mongo_data:

networks:
  maf:
